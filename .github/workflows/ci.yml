name: ci

on:
  push:
  pull_request:

# Least privilege: smoke only reads the tree and runs local Rust checks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust (stable)
        # Pinned to a master-branch commit (SHA pins cannot carry the ref's
        # toolchain spec, so `toolchain:` names it).
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Node runs the pure JS model tests (node:test, no npm packages).
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # PR CI proves reproducibility without a multi-hour Firefox build.
      # No fetch/checkout/apply here: those need GBs of upstream objects and
      # belong to the nightly full-build pipeline (see tools/ci/README.md).
      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        run: tools/ci/smoke.ps1
        shell: pwsh

      - name: Smoke (Linux/macOS)
        if: runner.os != 'Windows'
        run: tools/ci/smoke.sh
        shell: bash

  # engine.wasm is committed (the Firefox build needs no wasm toolchain):
  # rebuild it with the toolchain that made it and fail if the bytes differ,
  # so the shipped engine always matches aequera/extensions/ad-veil/engine.
  # The bytes are repeatable per host architecture only: this x86_64 Linux
  # build is the reference (tools/ci/README.md).
  engine:
    name: engine.wasm matches its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.98.1 (builds the committed engine.wasm)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - name: Rebuild and compare
        run: bash aequera/extensions/ad-veil/build-engine.sh --check
        shell: bash

      # On a mismatch, keep CI's build so the difference can be inspected.
      - name: Upload the CI build on mismatch
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-wasm-ci
          path: target/adveil-wasm/wasm32-unknown-unknown/release/aequera_adveil_engine.wasm
