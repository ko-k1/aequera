# Aequera design tokens v1 — promoted winning basement.
#
# Provenance: prototype/shell/app.js BASEMENT @ d4446c5 (user-declared win).
# Top 42, rail 42, panel 220, ctl 30, rpy/rpx 7/7, gap 6, rad 9,
# blur 24, sat 1.5, fs 14, tl 12, dur 250ms, easing swift.
# Profiles (minus/default/plus) mirror the prototype tune deltas; resolution
# order (defaults < profile < user < theme) lives in aequera/customization.
# No Firefox source change; consumed by aequera/shell + aequera/ui.

[meta]
schema_version = 1
promoted_from = "prototype/shell/app.js BASEMENT @ d4446c5"

[chrome]
top = 42
rail = 42
panel = 220
ctl = 30

[rows]
rpy = 7
rpx = 7
gap = 6

[shape]
rad = 9

# Material resolves to one OS backdrop behind all chrome (docs/design/MATERIAL.md).
# Backend mapping, kept in sync with aequera-prefs.js and aequera-rail.css:
# Windows 11 -> Acrylic (widget.windows.mica); macOS -> vibrancy (no pref yet,
# opaque toolbar fallback); Linux -> aequera.material.frame: "glass" tints
# the frame translucently and the compositor blurs behind it ("auto" picks it
# on desktops that blur by default), opaque otherwise. blur/sat below describe the Aequera
# side; the OS side stays a platform integration concern, never a token.
[material]
blur = 24
sat = 1.5

[type]
fs = 14

# Row wash (prototype .tab-row): one tint over any backdrop, at three
# strengths. Numbers only: the generator writes rgb(R G B / alpha).
[color]
wash = [127, 140, 170]
wash_hover = 0.12
wash_control = 0.18
wash_selected = 0.22

# Page palette: Firefox's in-content pages (Settings, Add-ons, error pages)
# and the new tab page. Each token is a light and a dark sRGB triplet; the
# generator writes light-dark(rgb(...), rgb(...)). The accent is the logo's
# cyan (#4ED5FF) in dark, deepened to #0369A1 in light. The generator
# rejects any text pair below WCAG AA 4.5:1 in either scheme (design.rs
# check_palette); today: on_accent on accent 5.9 light / 10.4 dark; accent
# on canvas 5.5 / 10.4; text_dim on canvas 5.4 / 6.8; text_dim on surface
# 5.8 / 6.1. Violet stays
# the private-window cue (privatebrowsing/aequera-private.css), never the
# accent here.
[palette]
canvas = { light = [246, 247, 249], dark = [22, 24, 28] }
surface = { light = [255, 255, 255], dark = [31, 34, 40] }
text = { light = [28, 31, 36], dark = [232, 234, 238] }
text_dim = { light = [95, 102, 114], dark = [154, 161, 173] }
accent = { light = [3, 105, 161], dark = [78, 213, 255] }
accent_hover = { light = [7, 89, 133], dark = [127, 224, 255] }
accent_active = { light = [12, 74, 110], dark = [168, 235, 255] }
on_accent = { light = [255, 255, 255], dark = [11, 26, 34] }

[traffic]
tl = 12

[motion]
dur_ms = 250
easing = "swift"
swift = "cubic-bezier(0.3,0.7,0.3,1)"
snappy = "cubic-bezier(0.2,0.9,0.25,1)"
smooth = "cubic-bezier(0.4,0,0.2,1)"

[profiles.minus.delta]
top = -6
rail = -8
panel = -32
ctl = -6
rpy = -2
rpx = -2
gap = -2
rad = -2
fs = -1

[profiles.plus.delta]
top = 6
rail = 12
panel = 32
ctl = 8
rpy = 2
rpx = 2
gap = 2
rad = 2
fs = 1
