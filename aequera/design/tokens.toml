# Aequera design tokens v1 — promoted winning basement.
#
# Provenance: prototype/shell/app.js BASEMENT @ d4446c5 (user-declared win).
# Top 42, rail 42, panel 220, ctl 30, rpy/rpx 7/7, gap 6, rad 9,
# blur 24, sat 1.5, fs 14, tl 12, dur 250ms, easing swift.
# Profiles (minus/default/plus) mirror the prototype tune deltas; resolution
# order (defaults < profile < user < theme) lives in aequera/customization.
# No Firefox source change; consumed by aequera/shell + aequera/ui.

[meta]
schema_version = 1
promoted_from = "prototype/shell/app.js BASEMENT @ d4446c5"

[chrome]
top = 42
rail = 42
panel = 220
ctl = 30

[rows]
rpy = 7
rpx = 7
gap = 6

[shape]
rad = 9

[material]
blur = 24
sat = 1.5

[type]
fs = 14

[traffic]
tl = 12

[motion]
dur_ms = 250
easing = "swift"
swift = "cubic-bezier(0.3,0.7,0.3,1)"
snappy = "cubic-bezier(0.2,0.9,0.25,1)"
smooth = "cubic-bezier(0.4,0,0.2,1)"

[profiles.minus.delta]
top = -6
rail = -8
panel = -32
ctl = -6
rpy = -2
rpx = -2
gap = -2
rad = -2
fs = -1

[profiles.plus.delta]
top = 6
rail = 12
panel = 32
ctl = 8
rpy = 2
rpx = 2
gap = 2
rad = 2
fs = 1
