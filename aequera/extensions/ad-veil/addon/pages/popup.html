<html lang="en">
<head>
<meta charset="utf-8">
<title>Ad Veil</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="popup.css">
<script src="popup.js" defer></script>
</head>
<body>
<main>
  <header>
    <h1>Ad Veil</h1>
    <p id="site" class="dim small"></p>
  </header>
  <fieldset class="modes" id="modes" disabled>
    <legend class="dim small">On this site</legend>
    <div class="segments">
      <label><input type="radio" name="mode" value="block" id="mode-block"><span>Block</span></label>
      <label><input type="radio" name="mode" value="veil" id="mode-veil"><span>Veil</span></label>
      <label><input type="radio" name="mode" value="off" id="mode-off"><span>Off</span></label>
    </div>
    <p id="mode-help" class="dim small"></p>
  </fieldset>
  <dl class="counts" aria-live="polite">
    <div><dt class="dim small">Blocked</dt><dd id="blocked">0</dd></div>
    <div><dt class="dim small">Hidden</dt><dd id="hidden">0</dd></div>
  </dl>
  <p id="note" class="dim small" hidden></p>
  <button id="vault" type="button">Open vault</button>
</main>
</body>
</html>
