<html lang="en">
<head>
<meta charset="utf-8">
<title>Ad Veil</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="popup.css">
<script src="../model.js" defer></script>
<script src="common.js" defer></script>
<script src="popup.js" defer></script>
</head>
<body>
<main>
  <header class="head">
    <span id="mark" class="mark" aria-hidden="true"></span>
    <div class="who">
      <h1>Ad Veil</h1>
      <p id="site" class="dim small"></p>
    </div>
    <button id="dashboard" class="icon-button" type="button" title="Dashboard" aria-label="Open the Ad Veil dashboard">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.25h12v1.5H2zm0 4h12v1.5H2zm0 4h8v1.5H2z"/></svg>
    </button>
  </header>

  <fieldset class="modes" id="modes" disabled>
    <legend class="dim small">On this site</legend>
    <div class="segments">
      <label><input type="radio" name="mode" value="block" id="mode-block"><span>Block</span></label>
      <label><input type="radio" name="mode" value="veil" id="mode-veil"><span>Veil</span></label>
      <label><input type="radio" name="mode" value="off" id="mode-off"><span>Off</span></label>
    </div>
    <p id="mode-help" class="dim small"></p>
  </fieldset>

  <section class="tiles" aria-label="This page" aria-live="polite">
    <div class="tile">
      <span class="value" id="blocked">0</span>
      <span class="label">blocked</span>
      <span class="label" id="blocked-share"></span>
    </div>
    <div class="tile">
      <span class="value" id="hidden">0</span>
      <span class="label">ads hidden</span>
    </div>
    <div class="tile">
      <span class="value" id="domains">0</span>
      <span class="label" id="domains-label">domains blocked</span>
    </div>
  </section>

  <section class="block" aria-labelledby="hosts-title">
    <h2 id="hosts-title" class="small">Blocked on this page</h2>
    <ol id="hosts" class="rows"></ol>
    <p id="hosts-more" class="dim small" hidden></p>
    <p id="hosts-empty" class="empty small">Nothing blocked on this page.</p>
  </section>

  <section class="block" aria-labelledby="ads-title">
    <h2 id="ads-title" class="small">Ads hidden here</h2>
    <ul id="ads" class="ad-list"></ul>
    <p id="ads-empty" class="empty small">No ads hidden on this page.</p>
  </section>

  <p id="note" class="dim small" hidden></p>

  <footer class="foot">
    <p id="totals" class="dim small"></p>
    <button id="vault" type="button">Open vault</button>
  </footer>
</main>
</body>
</html>
