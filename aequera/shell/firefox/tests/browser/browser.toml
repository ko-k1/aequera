[DEFAULT]
prefs = [
  "sidebar.revamp=false",
  "sidebar.verticalTabs=true",
  "sidebar.verticalTabs.requireRevamp=false",
]

["browser_aequera_rail.js"]

["browser_aequera_rail_side.js"]

["browser_aequera_workspaces.js"]

["browser_aequera_bookmarks_drawer.js"]

["browser_aequera_notifications.js"]

["browser_aequera_chrome_rebuild.js"]

["browser_aequera_default_layout.js"]

["browser_aequera_essentials.js"]

["browser_aequera_tabs.js"]

["browser_aequera_narrow.js"]

["browser_aequera_command.js"]

["browser_aequera_fullscreen.js"]

["browser_aequera_platform.js"]

["browser_aequera_extension_themes.js"]

["browser_aequera_material.js"]
support-files = ["material-helpers.js"]

# Per-OS behavior (platform/<os>/) is tested in per-OS files.
["browser_aequera_material_linux.js"]
run-if = ["os == 'linux'"]
support-files = ["material-helpers.js"]

["browser_aequera_material_macos.js"]
run-if = ["os == 'mac'"]
support-files = ["material-helpers.js"]

["browser_aequera_material_windows.js"]
run-if = ["os == 'win'"]
support-files = ["material-helpers.js"]

["browser_aequera_newtab.js"]

["browser_aequera_newtab_wallpaper.js"]

["browser_aequera_private.js"]

["browser_aequera_incontent.js"]

["browser_aequera_privacy.js"]

["browser_aequera_ai.js"]

["browser_aequera_tor.js"]
skip-if = ["os == 'win'"] # The Unix socket parts; Windows: browser_aequera_tor_windows.js

["browser_aequera_tor_windows.js"]
run-if = ["os == 'win'"] # Loopback TCP port (docs/design/TOR.md, Windows)
