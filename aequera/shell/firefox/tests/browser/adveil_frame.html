<title>Ad Veil framed ad fixture</title>

<body>
<!-- EasyList "##.ad_banner" hides the slot. As real ad tags do, a script
     draws the ad into an iframe without a src, after the slot exists. -->
<div class="ad_banner" id="slot"><iframe id="ad-frame" width="300" height="250"></iframe></div>
<div class="article">text</div>
<script src="adveil_frame.js"></script>
</body>
