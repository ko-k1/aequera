# Aequera patchset manifest.
#
# patches:  ordered Firefox changes (git apply, in order).
# overlays: Aequera-owned source copied into NEW worktree directories on
#           every apply; refused if dest holds any upstream-tracked file.
#
# Rules (docs/engineering/PATCHING.md):
# - one logical concern per commit; Git order is authoritative;
# - no monolithic patch; base must match upstream/manifests/firefox.lock.
# Textual application is necessary but not sufficient for an update:
# applies cleanly != builds != behaves correctly != passes quality gates.

manifest_version: 1

base:
  upstream:
    channel: release
    version: "157.0.1"
    revision: "0c469c2352451630bc69fc328c9f0c589c6c534d"

patches:
  # Hooks that build and load the shell-chrome overlay (4 lines). Rationale,
  # validation, and upstream risk are in the patch header.
  - id: shell-hooks
    series: browser/shell-hooks
  # Workspaces: parked (workspace-hidden) tabs keep the window open when the
  # last visible tab closes (pref-gated, empty by default).
  - id: workspace-hooks
    series: browser/workspace-hooks
  # Aequera-owned rail: vertical tabs without the sidebar revamp
  # (pref-gated coupling + launcher-less toggleTabstrip guards).
  - id: aequera-rail
    series: browser/aequera-rail
  # Leaner default toolbar layout (pref-gated list of widgets left out of
  # the defaults; empty by default).
  - id: customization-defaults
    series: browser/customization-defaults
  # Product identity: Aequera vendor and profile root, Firefox's user agent
  # name (project flags only the project's moz.configure may set; the rest
  # is mozconfig.branding).
  - id: branding
    series: build/branding
  # Default page icon: Aequera mark instead of the Mozilla globe
  # (Firefox-wide fallback: tabs, address bar, library, prompts). Single
  # toolkit file; the FAVICON_DEFAULT_URL contract is unchanged.
  - id: default-favicon
    series: toolkit/default-favicon
  # Linux desktop identity: session-bus names, the GNOME search provider,
  # the portal app ID, and the MPRIS suffix claim org.aequera, never
  # org.mozilla (docs/RESTRICTIONS.md). Rationale, validation, and upstream
  # risk are in each patch header. No behavior change beyond the names.
  - id: linux-desktop
    series: toolkit/linux-desktop
  # Aequera new tab page at about:newtab / about:home (pref-gated boolean,
  # fixed packaged page; absent in Firefox). Keeps preloading and the
  # shortcuts backend. Rationale and risk are in the patch header.
  - id: newtab
    series: browser/newtab
  # Aequera styling for about:privatebrowsing (one stylesheet link; the
  # page, its strings, and behavior stay Firefox's).
  - id: privatebrowsing
    series: browser/privatebrowsing
  # Settings > Browser layout: a vertical tabs side choice (Left / Right,
  # sidebar.position_start), offered only when a shell hosts vertical tabs
  # (sidebar.verticalTabs.requireRevamp false, from aequera-rail); Firefox's
  # defaults leave the group unchanged. The Aequera rail mirrors itself for
  # the right side (rail/aequera-rail.js [aequera-rail-end]).
  - id: rail-position
    series: browser/rail-position
  # Settings > Browser layout: "Magnify tab icons under the pointer"
  # (aequera.rail.magnify, Aequera's Dock-style in-place icon magnification),
  # offered under the same conditions as rail-position, after it.
  - id: rail-magnify
    series: browser/rail-magnify
  # Frame material on Linux (docs/design/MATERIAL.md): Wayland toplevels ask
  # the compositor to blur behind their translucent parts
  # (ext-background-effect-v1: KDE Plasma 6.7+, GNOME), and chrome reads
  # whether it does as (-moz-gtk-background-blur-available). Pref-gated
  # (widget.wayland.background-blur.enabled, off in Firefox). Compiled
  # builds only. Rationale, validation, and risk are in each patch header.
  - id: background-blur
    series: gecko/background-blur
  # Frame material on macOS 26+: titlebar vibrancy drawn as Liquid Glass
  # (NSGlassEffectView). Pref-gated (widget.macos.titlebar-glass.enabled,
  # off in Firefox). Not yet built or run on a Mac: see the patch header.
  - id: macos-glass
    series: gecko/macos-glass

overlays:
  # Stage 1 shell: frame-model stylesheet, launcher-width glue, default
  # prefs (vertical hover rail, 250ms motion, frame material). Source of truth:
  # aequera/shell/firefox; the worktree copy is generated.
  - id: shell-chrome
    source: aequera/shell/firefox
    dest: browser/aequera
  # Aequera branding: product name, logo and icons, branding prefs; selected
  # by --with-branding in tools/build/mozconfig.branding, together with the
  # identity options (vendor, profile root, remoting name). Configuration +
  # Aequera source, no Firefox patch: Firefox exposes all of it as supported
  # build options (patches/build/branding/README.md).
  - id: branding-assets
    source: aequera/design/branding
    dest: browser/branding/aequera
  # Ad Veil, the built-in ad and tracker blocker (docs/design/ADS.md, ADR
  # 0003): a built-in add-on packaged under builtin-addons/, built through
  # the shell-chrome overlay's moz.build. Aequera source, no Firefox patch.
  - id: ad-veil
    source: aequera/extensions/ad-veil/addon
    dest: browser/aequera-adveil
