# Aequera tor lock: the Tor Project's tor expert bundle, the tor (and
# pluggable transports) Tor Browser ships, bundled into builds as <app>/tor
# for Tor windows (docs/adr/0004-tor-windows.md, docs/design/TOR.md).
#
# Canonical pin: the SHA-256 of each platform's archive. They are copied from
# the release's sha256sums-signed-build.txt only after its OpenPGP signature
# verifies with the Tor Browser Developers signing key below
# (tools/tor/update-pin.sh). tools/tor/fetch-bundle.sh refuses any archive
# whose hash differs. A build never takes a newer bundle on its own.
#
# The browser never downloads tor: this is fetched at build time only.

