# Aequera branding defaults (schema validation lands in W5: `config validate`).
#
# Until then: human-authored, machine-read later. Do not add keys here without
# updating patches/build/branding/README.md to say what consumes them.

[meta]
schema_version = 1

[product]
display_name = "Aequera"
app_name = "aequera"
vendor = "Aequera"
remoting_name = "aequera"
dbus_service = "org.aequera.browser"
update_channel = "aequera-release"

[profile]
# Explicit opt-in only; the product never auto-migrates Firefox profiles.
import_firefox_profile = false
migrate_on_first_run = false

[profile.paths]
windows_roaming = "%APPDATA%\\Aequera\\Profiles"
windows_local = "%LOCALAPPDATA%\\Aequera\\Profiles"
linux = "~/.aequera"
macos = "~/Library/Application Support/Aequera"

[telemetry_identity]
# Branding must never re-enable what W5 disables.
client_id_enabled = false
attribution_enabled = false
studies_enabled = false
