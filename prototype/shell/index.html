<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aequera Shell Prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="wallpaper" aria-hidden="true"></div>
<!-- The frame: the ONE glass layer behind all chrome (Zen/Arc model). Top
     bar, rail, and bookmark row are transparent on top of it, so they are
     the same material by construction; the page is a card inset in it. -->
<div id="frame" class="glass" aria-hidden="true"></div>

<!-- Top address bar: full width, so a hovering tab bar can never overlap it.
     Transparent: it sits on the shared frame material. -->
<header id="topbar">
  <div class="traffic" role="toolbar" aria-label="Window controls">
    <button class="tl close" data-act="win-close" aria-label="Close (decorative in prototype)"><span aria-hidden="true">×</span></button>
    <button class="tl min" data-act="win-min" aria-label="Collapse sidebar"><span aria-hidden="true">–</span></button>
    <button class="tl max" data-act="win-pin" aria-label="Pin sidebar open" aria-pressed="false"><span aria-hidden="true">+</span></button>
  </div>
  <div class="nav" role="toolbar" aria-label="Navigation">
    <button data-act="back" aria-label="Back">←</button>
    <button data-act="fwd" aria-label="Forward">→</button>
    <button data-act="reload" aria-label="Reload">⟳</button>
  </div>
  <!-- Pinned pills appear here ONLY as a consequence of dragging a tab in.
       Empty (the default) it takes no space at all: no reserved top strip. -->
  <div id="pinbar" aria-label="Pinned tabs"></div>
  <div class="addr-wrap">
    <div id="addr-row">
      <svg id="lock" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor" opacity=".7"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      <input id="addr" type="text" role="combobox" aria-expanded="false" aria-controls="results" aria-label="Address, search tabs, commands and workspaces" placeholder="Search tabs, commands, or type an address" autocomplete="off" spellcheck="false">
      <button data-act="newtab" aria-label="New tab">+</button>
    </div>
    <div id="results" role="listbox" aria-label="Matches" hidden></div>
  </div>
  <button id="tune-toggle" data-tune-toggle aria-expanded="false" aria-controls="tune">Tune</button>
  <!-- Bookmark toolbar: a second row of the top bar itself, drawn on the
       frame (no surface of its own), revealed as the page card yields.
       Opt-out via Tune (Always / New tab only / Never); closed it is inert. -->
  <div id="bookmarkbar" inert aria-label="Bookmarks"></div>
</header>


<section id="tune" hidden aria-label="Interface tuning">
  <div class="tune-row seg" role="group" aria-label="Profile">
    <button data-profile="minus" aria-pressed="false" title="Basement minus deltas">− Minus</button>
    <button data-profile="default" aria-pressed="true" title="Basement values">Default</button>
    <button data-profile="plus" aria-pressed="false" title="Basement plus deltas">+ Plus</button>
  </div>
  <label class="tune-row">Motion
    <input id="t-dur" type="range" min="0" max="400" step="10" value="250">
    <output id="t-dur-v" for="t-dur">250ms</output>
  </label>
  <label class="tune-row">Easing
    <select id="t-ease">
      <option value="snappy">Snappy</option>
      <option value="smooth">Smooth</option>
      <option value="swift" selected>Swift</option>
    </select>
  </label>
  <label class="tune-row">Bookmarks
    <select id="t-bbmode">
      <option value="hover">Hover to reveal</option>
      <option value="always">Always show</option>
      <option value="newtab">New tab only</option>
      <option value="never">Never (opt out)</option>
    </select>
  </label>
  <div class="tune-row"><button id="t-replay">Replay expand</button></div>
  <label class="tune-row">Top bar <input id="t-top" type="number" min="36" max="80" step="2"> px</label>
      <label class="tune-row">Rail <input id="t-rail" type="number" min="32" max="120" step="2"> px</label>
  <label class="tune-row">Panel <input id="t-panel" type="number" min="180" max="420" step="4"> px</label>
      <label class="tune-row">Buttons <input id="t-ctl" type="number" min="20" max="56" step="2"> px</label>
      <label class="tune-row">Row pad Y <input id="t-rpy" type="number" min="0" max="20" step="1"> px</label>
      <label class="tune-row">Row pad X <input id="t-rpx" type="number" min="0" max="24" step="1"> px</label>
  <label class="tune-row">Spacing <input id="t-gap" type="number" min="0" max="20" step="1"> px</label>
  <label class="tune-row">Radius <input id="t-rad" type="number" min="0" max="20" step="1"> px</label>
  <label class="tune-row">Blur <input id="t-blur" type="number" min="0" max="60" step="1"> px</label>
  <label class="tune-row">Saturation <input id="t-sat" type="number" min="0" max="3" step="0.1"> ×</label>
  <label class="tune-row">Font <input id="t-fs" type="number" min="10" max="18" step="1"> px</label>
  <label class="tune-row">Lights <input id="t-tl" type="number" min="8" max="20" step="1"> px</label>
  <div class="tune-row"><button id="t-reset">Reset</button><span class="t-note">accent border = custom override · double-click a field to clear it · saved on this machine only</span></div>
</section>

<div id="sidebar">
  <!-- Self-expanding bar below the full-width address bar: collapsed shows
       favicons only; on hover the bar itself widens and titles + URLs appear
       next to stable icons. Never overlaps the address bar (own region). -->
  <div id="rail">
    <ul id="tab-list" aria-label="Tabs"></ul>
    <div id="ws-rail" role="tablist" aria-label="Workspaces">
      <!-- Both layers share one grid cell and crossfade in place. The active
           dot lives INSIDE the dots scroller: it scrolls, clips, and fades
           with the dots, and persists across renders so it can glide. -->
      <div id="ws-dots" class="ws-layer"><div class="clip"><div class="scroll">
        <span id="ws-indicator" aria-hidden="true"></span>
        <div class="items"></div>
      </div></div></div>
      <div id="ws-rows" class="ws-layer"><div class="clip">
        <div class="scroll"><div class="items"></div></div>
        <button class="tab-row" data-act="new-workspace" aria-label="New workspace">
          <span class="nic" aria-hidden="true">+</span><span class="t">New workspace</span>
        </button>
      </div></div>
    </div>
    <div id="lib-list" aria-label="Library"></div>
    <button id="settings-rail" class="tab-row" data-act="settings" data-tune-toggle aria-label="Settings" aria-expanded="false" aria-controls="tune" title="Settings">
      <span class="nic" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.4v2.1M8 12.5v2.1M1.4 8h2.1M12.5 8h2.1M3.3 3.3l1.5 1.5M11.2 11.2l1.5 1.5M12.7 3.3l-1.5 1.5M4.8 11.2l-1.5 1.5"/></g></svg></span>
    </button>
  </div>
</div>

<main id="content">
  <div id="page" aria-live="polite"></div>
  <div id="fps" title="Local frame meter: requestAnimationFrame delta, exponential moving average. No data leaves this page.">– fps</div>
  <div id="toast" role="status" hidden></div>
</main>

<script src="app.js"></script>
</body>
</html>
